<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KitSmith · build per Pro Clubs</title>
<meta name="description" content="Crea, confronta e condividi build per Pro Clubs. Punti AP sempre giusti.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Barlow:wght@400;600&display=swap">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    background:radial-gradient(700px 500px at 50% 20%,rgba(124,92,255,.22),transparent 60%),#07060C;color:#F4F2FF;font:16px/1.5 Barlow,system-ui,sans-serif}
  main{width:100%;max-width:440px;text-align:center}
  .mark{display:inline-flex;align-items:center;gap:12px;font:700 40px 'Chakra Petch',sans-serif}
  .spark{width:19px;height:38px;border-radius:4px;background:linear-gradient(180deg,#2FE6C9,#7C5CFF);box-shadow:0 0 24px rgba(124,92,255,.7);transform:skewX(-12deg)}
  h1{font:700 26px 'Chakra Petch',sans-serif;margin:22px 0 8px}
  p{color:#A09CB8;margin:0 0 22px}
  .btn{display:block;padding:15px;border-radius:14px;font:600 17px Barlow,sans-serif;text-decoration:none;background:linear-gradient(135deg,#7C5CFF,#5B3FE0);color:#fff}
  .small{color:#8A8699;font-size:13px;margin-top:20px}
  .small a{color:#9E8BFF}
</style>
</head>
<body>
<main>
  <div class="mark"><span class="spark"></span>KitSmith</div>
  <h1>Build perfette per Pro Clubs</h1>
  <p>Crea la build con l'assistente, controlla i punti AP, confrontala e condividila con il tuo club.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=app.kitsmith">Scarica KitSmith da Google Play</a>
  <p class="small"><a href="/privacy/">Informativa privacy</a> · kitsmith.app@gmail.com<br>KitSmith non è affiliata, approvata o sponsorizzata da Electronic Arts.</p>
</main>
</body>
</html>
